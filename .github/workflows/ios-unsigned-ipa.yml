name: iOS unsigned IPA

# Builds an UNSIGNED .ipa on a GitHub-hosted macOS runner (Xcode 15+), which
# this project's dev Mac can't do (macOS 12 / Xcode 13). No Apple Developer
# account is involved — signing is disabled. The .ipa installs only on a
# jailbroken device or after re-signing; for a normal install, enrol in the
# Apple Developer Program and use `eas build -p ios --profile preview`.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - run: npm ci

      - name: Build unsigned .ipa
        run: npm run build:ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FlyerMindAI-unsigned-ipa
          path: build-ipa/FlyerMindAI-unsigned.ipa
          if-no-files-found: error
